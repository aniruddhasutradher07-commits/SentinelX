apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelx-ingress
  namespace: disaster-management
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  tls:
  - hosts:
    - sentinelx.ndma.gov.in
    - heatwave.moes.gov.in
    secretName: sentinelx-tls-cert
  rules:
  - host: sentinelx.ndma.gov.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentinelx-service
            port:
              number: 80
  - host: heatwave.moes.gov.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentinelx-service
            port:
              number: 80
