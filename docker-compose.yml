version: "3.9"

services:
  sentinelx-api:
    build:
      context: .
      dockerfile: Dockerfile
      # Multi-stage build leverages layer caching for faster rebuilds
    container_name: sentinelx_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Use .env file for secrets; never hardcode API keys
      - TZ=Asia/Kolkata
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PORT=8000
      # Load from .env file (create .env locally with real secrets)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - WEATHERAPI_KEY=${WEATHERAPI_KEY}
    # PRODUCTION: Remove bind mount; copy files into image instead
    # DEVELOPMENT: Uncomment volumes for hot-reload
    # volumes:
    #   - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
