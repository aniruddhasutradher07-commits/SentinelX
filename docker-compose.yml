services:
  sentinelx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelx_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyDR9BlDJxO2z4RQEUcqGH4W9sE2E28S5d4}
      - NEWS_API_KEY=${NEWS_API_KEY:-ae6b26e8512d4fb8a6d5a917923908f6}
      - WEATHERAPI_KEY=${WEATHERAPI_KEY:-34b0083b19ed408b8ad65436263008}
      - PORT=8000
    volumes:
      - ./sentinelx_data.db:/app/sentinelx_data.db
      - ./heatwave.db:/app/heatwave.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
